<script>
const I={board:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',chart:'<path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 5-7"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',moon:'<path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',check:'<path d="m5 12 4 4L19 6"/>',filter:'<path d="M4 7h16M7 12h10m-7 5h4"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/>',arrow:'<path d="M5 12h14m-7-7 7 7-7 7"/>',close:'<path d="m18 6-12 12M6 6l12 12"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.5.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.5-.9l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.8l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.5-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.5.9l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.8Z"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/>'};
const ic=(n,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||I.plus}</svg>`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{let d=new Date;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const after=n=>{let d=new Date;d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const seed={columns:[['backlog','Backlog','#8a8886'],['todo','To do','#d6a45e'],['progress','In progress','#0f6cbd'],['review','Review','#8b87b8'],['done','Done','#0e700e']].map(([id,title,accent])=>({id,title,accent})),tasks:[{id:'a1',columnId:'todo',title:'Map the onboarding flow',description:'Outline the first-time experience and identify the screens a new user needs.',priority:'High',dueDate:after(2)},{id:'a2',columnId:'progress',title:'Set up project repository',description:'Create the repo, agree on a branch convention, and add the initial README.',priority:'Medium',dueDate:after(1)},{id:'a3',columnId:'backlog',title:'Collect reference material',description:'Gather examples of clear, useful project tools.',priority:'Low',dueDate:after(7)},{id:'a4',columnId:'review',title:'Review the component map',description:'Check that component boundaries are clear and responsibilities are easy to follow.',priority:'Medium',dueDate:after(-1)},{id:'a5',columnId:'done',title:'Define the project scope',description:'Agree on the first release: boards, tasks, priorities, deadlines, and local persistence.',priority:'High',dueDate:after(-2)}],activity:[]};let state;try{state={...seed,...JSON.parse(localStorage.getItem('taskforge-fluent')||'{}')}}catch{state={...seed}}state.view='board';state.search='';state.filter='All';state.modal=false;state.modalMode='task';state.modalData=null;state.edit=null;state.drag=null;let toastTimer;
function save(){localStorage.setItem('taskforge-fluent',JSON.stringify({columns:state.columns,tasks:state.tasks,activity:state.activity,theme:state.theme||'light'}))}function log(s){state.activity.unshift({text:s,at:Date.now()});state.activity=state.activity.slice(0,40)}function toast(s){let e=document.querySelector('.toast');if(e)e.remove();e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2200)}
function menu(t){return `<details class="task-menu"><summary class="icon-btn more" aria-label="More options">${ic('dots')}</summary><div class="menu"><button data-act="edit" data-id="${t.id}"> ${ic('edit',14)} Edit</button>${state.columns.filter(c=>c.id!==t.columnId).map(c=>`<button data-act="move" data-id="${t.id}" data-col="${c.id}">${ic('arrow',14)} Move to ${esc(c.title)}</button>`).join('')}<button class="danger" data-act="delete" data-id="${t.id}">${ic('trash',14)} Delete</button></div></details>`}
function taskCard(t){let overdue=t.dueDate&&t.dueDate<today()&&t.columnId!=='done';return `<article class="task ${t.columnId==='done'?'done':''}" draggable="true" data-task="${t.id}"><div class="task-top"><button class="complete ${t.columnId==='done'?'checked':''}" data-act="complete" data-id="${t.id}" aria-label="Mark ${t.columnId==='done'?'incomplete':'complete'}">${ic('check',11)}</button><div class="task-title">${esc(t.title)}</div>${menu(t)}</div>${t.description?`<p class="task-desc">${esc(t.description)}</p>`:''}<div class="task-footer"><span class="due ${overdue?'overdue':''}">${ic('calendar',12)}${t.dueDate?new Date(t.dueDate+'T00:00:00').toLocaleDateString('en',{month:'short',day:'numeric'}):'No date'}</span><span class="badge ${t.priority.toLowerCase()}">${t.priority}</span></div></article>`}
function render(){let tasks=state.tasks.filter(t=>(!state.search||`${t.title} ${t.description}`.toLowerCase().includes(state.search.toLowerCase()))&&(state.filter==='All'||t.priority===state.filter));let total=state.tasks.length,done=state.tasks.filter(t=>t.columnId==='done').length,late=state.tasks.filter(t=>t.dueDate&&t.dueDate<today()&&t.columnId!=='done').length,pct=total?Math.round(done/total*100):0;let cols=state.columns.map(c=>`<section class="column" data-column="${c.id}"><header class="column-head"><div class="column-title"><i class="column-dot" style="background:${c.accent}"></i>${esc(c.title)} <span class="column-count">${tasks.filter(t=>t.columnId===c.id).length}</span></div><div class="column-actions"><button class="icon-btn" data-act="new" data-col="${c.id}" aria-label="Add task">${ic('plus',15)}</button><details class="task-menu"><summary class="icon-btn" aria-label="Column options">${ic('dots',15)}</summary><div class="menu"><button data-act="rename-col" data-id="${c.id}">${ic('edit',14)} Rename</button><button class="danger" data-act="delete-col" data-id="${c.id}">${ic('trash',14)} Delete column</button></div></details></div></header><div class="cards" data-drop="${c.id}">${tasks.filter(t=>t.columnId===c.id).map(taskCard).join('')||'<div class="empty">No tasks in this column</div>'}</div><button class="add-card" data-act="new" data-col="${c.id}">${ic('plus',14)} Add a task</button></section>`).join('');let body=state.view==='board'?`<div class="board-wrap"><div class="board">${cols}<button class="add-column" data-act="add-col">${ic('plus',15)} Add column</button></div></div>`:state.view==='grid'?`<div class="view-panel"><table class="grid-table"><thead><tr><th>Task</th><th>Status</th><th>Priority</th><th>Due date</th><th></th></tr></thead><tbody>${tasks.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(state.columns.find(c=>c.id===t.columnId)?.title||'')}</td><td><span class="badge ${t.priority.toLowerCase()}">${t.priority}</span></td><td>${esc(t.dueDate||'—')}</td><td><button class="icon-btn" data-act="edit" data-id="${t.id}">${ic('edit',14)}</button></td></tr>`).join('')}</tbody></table></div>`:state.view==='charts'?`<div class="view-panel"><h3 style="font-size:14px;margin:2px 0 12px">Tasks by status</h3><div class="chart-bars">${state.columns.map(c=>{let n=state.tasks.filter(t=>t.columnId===c.id).length;return `<div class="chart-item"><strong>${n}</strong><div class="bar" style="height:${Math.max(2,n/Math.max(1,total)*125)}px"></div>${esc(c.title)}</div>`}).join('')}</div></div>`:`<div class="view-panel">${state.activity.map(a=>`<div class="activity-row">${esc(a.text)}<time>${new Date(a.at).toLocaleString()}</time></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div>`;
document.querySelector('#app').innerHTML=`<header class="shell"><div class="brand"><span class="brand-mark">t</span>Taskforge</div><div class="shell-right"><span class="shell-caption">Studio workspace</span><button class="icon-btn" data-act="theme" aria-label="Toggle theme">${ic(state.theme==='dark'?'sun':'moon')}</button></div></header><div class="layout"><aside class="rail"><div class="workspace"><span class="workspace-avatar">S</span><div><strong>Studio workspace</strong><small>Personal space</small></div></div><div class="nav-label">WORKSPACE</div><button class="nav-item active">${ic('board')}<span>Project board</span><span class="nav-count">${total}</span></button><button class="nav-item" data-act="activity">${ic('chart')}<span>Activity</span></button><div class="rail-bottom">Taskforge<br>Changes are saved on this device.</div></aside><main class="main"><div class="breadcrumbs">Workspace <span>/</span> <strong>Product launch</strong></div><div class="project-head"><div><div class="head-meta">PERSONAL PROJECT · UPDATED JUST NOW</div><h1>Product launch</h1><p>A clear place to plan the work and keep things moving.</p></div><div class="head-actions"><button class="btn" data-act="export">${ic('download',14)} Export</button></div></div><nav class="pivots"><button class="pivot ${state.view==='board'?'active':''}" data-view="board">Board</button><button class="pivot ${state.view==='grid'?'active':''}" data-view="grid">Grid</button><button class="pivot ${state.view==='charts'?'active':''}" data-view="charts">Charts</button></nav><section class="stats"><div class="stat"><span class="stat-label">Total tasks</span><strong class="stat-value">${total}</strong><span class="stat-foot">Across all columns</span></div><div class="stat"><span class="stat-label">Completed</span><strong class="stat-value">${done}</strong><span class="stat-foot">${pct}% of all tasks</span></div><div class="stat"><span class="stat-label">Overdue</span><strong class="stat-value">${late}</strong><span class="stat-foot">${late?'Needs attention':'Nothing overdue'}</span></div><div class="stat"><span class="stat-label">Overall progress</span><strong class="stat-value">${pct}%</strong><div class="progress-line"><span style="width:${pct}%"></span></div></div></section><div class="commandbar"><button class="btn primary" data-act="new">${ic('plus',15)} Add task</button><span class="separator"></span><button class="btn" data-act="focus-filter">${ic('filter',15)} Filter</button><select id="filter" aria-label="Filter by priority" style="height:27px;border:0;background:transparent;color:inherit;font-size:12px"><option ${state.filter==='All'?'selected':''}>All</option><option ${state.filter==='High'?'selected':''}>High</option><option ${state.filter==='Medium'?'selected':''}>Medium</option><option ${state.filter==='Low'?'selected':''}>Low</option></select><span class="separator"></span><button class="btn" data-act="group">${ic('list',15)} Group by status</button><span class="spacer"></span><label style="display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px">${ic('search',14)}<input id="search" placeholder="Search tasks" value="${esc(state.search)}" style="width:125px;border:0;background:transparent;color:inherit;outline:none"></label></div>${body}</main></div>${state.modal?modalHTML():''}`;save()}
function modalHTML(){
const close=`<button class="icon-btn" type="button" data-act="close" aria-label="Close">${ic('close')}</button>`;
if(state.modalMode==='column'){const c=state.modalData?.column;return `<div class="modal-backdrop" data-act="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-head"><h2 id="dialog-title">${c?'Rename column':'Add column'}</h2>${close}</header><form id="columnform" class="form"><label class="field">Column name<input name="name" maxlength="30" required autofocus value="${esc(c?.title||'')}" placeholder="Enter a column name"></label><div class="modal-foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">${c?'Save changes':'Add column'}</button></div></form></section></div>`}
if(state.modalMode==='confirm'){const d=state.modalData;return `<div class="modal-backdrop" data-act="backdrop"><section class="modal" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description"><header class="modal-head"><h2 id="dialog-title">${esc(d.title)}</h2>${close}</header><div class="form"><p id="dialog-description" class="dialog-copy">${esc(d.message)}</p><div class="modal-foot"><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn danger-btn" data-act="confirm-action">${esc(d.confirmLabel||'Delete')}</button></div></div></section></div>`}
let t=state.edit||{title:'',description:'',priority:'Medium',dueDate:'',columnId:state.defaultCol||state.columns[0]?.id};return `<div class="modal-backdrop" data-act="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-head"><h2 id="dialog-title">${state.edit?'Edit task':'Create task'}</h2>${close}</header><form id="taskform" class="form"><label class="field">Task title<input name="title" maxlength="90" required autofocus value="${esc(t.title)}" placeholder="Enter a task title"></label><label class="field">Description<textarea name="description" maxlength="500" placeholder="Add useful context">${esc(t.description)}</textarea></label><div class="form-row"><label class="field">Priority<select name="priority">${['Low','Medium','High'].map(p=>`<option ${p===t.priority?'selected':''}>${p}</option>`).join('')}</select></label><label class="field">Due date<input name="dueDate" type="date" value="${esc(t.dueDate)}"></label></div><label class="field">Column<select name="columnId">${state.columns.map(c=>`<option value="${c.id}" ${c.id===t.columnId?'selected':''}>${esc(c.title)}</option>`).join('')}</select></label><div class="modal-foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">${state.edit?'Save changes':'Create task'}</button></div></form></section></div>`}
function openDialog(mode,data){state.modal=true;state.modalMode=mode;state.modalData=data||null;render();const focus=mode==='column'?'[name=name]':mode==='task'?'[name=title]':'[data-act=confirm-action]';document.querySelector(focus)?.focus()}
function closeDialog(){state.modal=false;state.modalMode='task';state.modalData=null;state.edit=null;render()}
function runConfirmedAction(){const d=state.modalData;if(!d)return;if(d.kind==='delete-task'){state.tasks=state.tasks.filter(t=>t.id!==d.id);log(`Deleted ${d.label}`)}if(d.kind==='delete-column'){state.tasks.forEach(t=>{if(t.columnId===d.id)t.columnId=d.target.id});state.columns=state.columns.filter(c=>c.id!==d.id);log(`Deleted column ${d.label}`)}closeDialog();toast('Changes saved')}
function openModal(id,col){state.edit=id?state.tasks.find(t=>t.id===id):null;state.defaultCol=col||state.edit?.columnId||state.columns[0]?.id;openDialog('task')}
function exportData(){let blob=new Blob([JSON.stringify({columns:state.columns,tasks:state.tasks,activity:state.activity},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='taskforge-backup.json';a.click();URL.revokeObjectURL(url)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let {act,id,col}=b.dataset;if(act==='backdrop'&&e.target!==b)return;if(act==='backdrop'||act==='close'){closeDialog();return}if(act==='confirm-action'){runConfirmedAction();return}if(act==='new')openModal(null,col);if(act==='edit')openModal(id);if(act==='complete'){let t=state.tasks.find(t=>t.id===id);if(t){t.columnId=t.columnId==='done'?(state.columns.find(c=>c.id!=='done')?.id||state.columns[0].id):'done';log(`${t.title} marked ${t.columnId==='done'?'complete':'incomplete'}`);render()}}if(act==='move'){let t=state.tasks.find(t=>t.id===id),c=state.columns.find(c=>c.id===col);if(t&&c){t.columnId=col;log(`Moved ${t.title} to ${c.title}`);render()}}if(act==='delete'){let t=state.tasks.find(t=>t.id===id);if(t)openDialog('confirm',{title:'Delete task?',message:`Delete “${t.title}”? This action cannot be undone.`,confirmLabel:'Delete task',kind:'delete-task',id:t.id,label:t.title})}if(act==='rename-col'){let c=state.columns.find(c=>c.id===id);if(c)openDialog('column',{column:c})}if(act==='delete-col'){if(state.columns.length<2){toast('At least one column is required');return}let c=state.columns.find(c=>c.id===id),target=state.columns.find(x=>x.id!==id);if(c&&target)openDialog('confirm',{title:'Delete column?',message:`Delete “${c.title}”? Its tasks will be moved to “${target.title}”. This action cannot be undone.`,confirmLabel:'Delete column',kind:'delete-column',id:c.id,label:c.title,target})}if(act==='add-col')openDialog('column');if(act==='theme'){state.theme=state.theme==='dark'?'light':'dark';document.body.classList.toggle('dark',state.theme==='dark');render()}if(act==='activity'){state.view='activity';render()}if(act==='export'){exportData();toast('Backup exported')}if(act==='focus-filter'){document.querySelector('#filter')?.focus()}if(act==='group'){state.view='board';render()} });
document.addEventListener('click',e=>{let tab=e.target.closest('[data-view]');if(tab){state.view=tab.dataset.view;render()}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){state.filter=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){let v=e.target.value,pos=e.target.selectionStart;state.search=v;render();let input=document.querySelector('#search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(!['taskform','columnform'].includes(e.target.id))return;e.preventDefault();let d=new FormData(e.target);if(e.target.id==='columnform'){let name=String(d.get('name')||'').trim();if(!name){e.target.elements.name.focus();return}name=name.slice(0,30);const column=state.modalData?.column;if(column){column.title=name;log(`Renamed column to ${name}`)}else{state.columns.push({id:crypto.randomUUID(),title:name,accent:'#8a8886'});log(`Added column ${name}`)}closeDialog();toast('Column saved');return}let title=String(d.get('title')||'').trim();if(!title){document.querySelector('[name=title]').focus();return}let data={title,description:String(d.get('description')||'').trim(),priority:String(d.get('priority')),dueDate:String(d.get('dueDate')),columnId:String(d.get('columnId'))};if(state.edit){Object.assign(state.edit,data);log(`Updated ${title}`)}else{state.tasks.unshift({id:crypto.randomUUID(),...data});log(`Created ${title}`)}closeDialog();toast('Task saved')});
document.addEventListener('dragstart',e=>{let card=e.target.closest('[data-task]');if(!card)return;state.drag=card.dataset.task;e.dataTransfer.setData('text/plain',state.drag);e.dataTransfer.effectAllowed='move'});document.addEventListener('dragover',e=>{let zone=e.target.closest('[data-drop]');if(zone){e.preventDefault();zone.classList.add('dragover')}});document.addEventListener('dragleave',e=>{let zone=e.target.closest('[data-drop]');if(zone&&!zone.contains(e.relatedTarget))zone.classList.remove('dragover')});document.addEventListener('drop',e=>{let zone=e.target.closest('[data-drop]');if(!zone||!state.drag)return;e.preventDefault();let t=state.tasks.find(t=>t.id===state.drag);if(t){t.columnId=zone.dataset.drop;log(`Moved ${t.title} to ${state.columns.find(c=>c.id===t.columnId)?.title}`)}state.drag=null;render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal){closeDialog()}document.querySelectorAll('details[open]').forEach(d=>d.open=false)}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('#search')?.focus()}});
if(state.theme==='dark')document.body.classList.add('dark');render();
</script></body></html>
