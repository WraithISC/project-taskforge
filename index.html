const I = {
  board:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  chart:'<path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 5-7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  moon:'<path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/>',
  dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  check:'<path d="m5 12 4 4L19 6"/>', filter:'<path d="M4 7h16M7 12h10m-7 5h4"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/>',
  arrow:'<path d="M5 12h14m-7-7 7 7-7 7"/>', close:'<path d="m18 6-12 12M6 6l12 12"/>',

const ic = (name, size = 16) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[name] || I.plus}</svg>`;

// 2. State and storage
const today = () => {
  const date = new Date();
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
};
const after = days => {
  const date = new Date();

const seed = {
  projectTitle: 'Product launch', lastModified: Date.now(), theme: null,
  columns: [
    {id:'backlog',title:'Backlog',accent:'#8a8886',isDone:false},
    {id:'todo',title:'To do',accent:'#d6a45e',isDone:false},
    {id:'progress',title:'In progress',accent:'#0f6cbd',isDone:false},
    {id:'review',title:'Review',accent:'#8b87b8',isDone:false},
    {id:'done',title:'Done',accent:'#0e700e',isDone:true}
  ],
  tasks: [
    {id:'a1',columnId:'todo',title:'Map the onboarding flow',description:'Outline the first-time experience and identify the screens a new user needs.',priority:'High',dueDate:after(2),color:'#0f6cbd'},
    {id:'a2',columnId:'progress',title:'Set up project repository',description:'Create the repo, agree on a branch convention, and add the initial README.',priority:'Medium',dueDate:after(1),color:'#0f6cbd'},
    {id:'a3',columnId:'backlog',title:'Collect reference material',description:'Gather examples of clear, useful project tools.',priority:'Low',dueDate:after(7),color:'#0f6cbd'},
    {id:'a4',columnId:'review',title:'Review the component map',description:'Check that component boundaries are clear and responsibilities are easy to follow.',priority:'Medium',dueDate:after(-1),color:'#0f6cbd'},
    {id:'a5',columnId:'done',title:'Define the project scope',description:'Agree on the first release: boards, tasks, priorities, deadlines, and local persistence.',priority:'High',dueDate:after(-2),color:'#0f6cbd'}
  ], activity: []
};
function uid() {
  if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();

}

  if (!raw || !Array.isArray(raw.columns) || !Array.isArray(raw.tasks)) throw new Error('Backup must contain columns and tasks arrays.');

    id:c.id, title:c.title.slice(0,30), accent:typeof c.accent === 'string' && /^#[0-9a-f]{6}$/i.test(c.accent) ? c.accent : '#8a8886', isDone:typeof c.isDone === 'boolean' ? c.isDone : c.id === 'done'

  if (!columns.length || new Set(columns.map(c=>c.id)).size !== columns.length) throw new Error('Backup has no valid columns or contains duplicate column IDs.');
  const columnIds = new Set(columns.map(c=>c.id));
  const tasks = raw.tasks.filter(t => t && typeof t.id === 'string' && typeof t.title === 'string' && columnIds.has(t.columnId)).map(t => ({
    id:t.id, columnId:t.columnId, title:t.title.slice(0,90), description:typeof t.description === 'string' ? t.description.slice(0,500) : '',
    priority:PRIORITIES.includes(t.priority) ? t.priority : 'Medium', dueDate:typeof t.dueDate === 'string' ? t.dueDate : '',
    color:TASK_COLORS.includes(t.color) ? t.color : '#0f6cbd', previousColumnId:typeof t.previousColumnId === 'string' ? t.previousColumnId : null
  }));
  const activity = Array.isArray(raw.activity) ? raw.activity.filter(a=>a && typeof a.text==='string' && Number.isFinite(Number(a.at))).slice(0,40) : [];
  return {columns,tasks,activity,theme:raw.theme==='dark'||raw.theme==='light'?raw.theme:null,
    projectTitle:typeof raw.projectTitle==='string'&&raw.projectTitle.trim()?raw.projectTitle.trim().slice(0,60):'Product launch',
    lastModified:Number.isFinite(Number(raw.lastModified))?Number(raw.lastModified):Date.now()};
}
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return structuredClone(seed);
    const parsed = JSON.parse(saved);
    const validated = validateData({...seed,...parsed});
    // Old saves used the ID "done" as the only completion marker.
    validated.columns.forEach(column => { if (column.id === 'done' && !('isDone' in (parsed.columns?.find(c=>c.id===column.id)||{}))) column.isDone = true; });
    return validated;
  } catch (error) {
    console.warn('Taskforge could not load saved data:', error);
    return structuredClone(seed);
  }

const state = loadState();
state.view = 'board'; state.search = ''; state.filter = 'All'; state.groupByPriority = false;
state.modal = false; state.modalMode = 'task'; state.modalData = null; state.edit = null;
state.defaultCol = state.columns[0]?.id; state.drag = null;
let toastTimer; let saveErrorShown = false;
const systemTheme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
state.theme = state.theme || systemTheme;

// 3. Helpers
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const doneColumn = () => state.columns.find(column => column.isDone);
const firstOpenColumn = () => state.columns.find(column => !column.isDone);
const isTaskDone = task => Boolean(state.columns.find(column=>column.id===task.columnId)?.isDone);
function applyTheme() {
  document.body.classList.toggle('dark', state.theme === 'dark');
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', state.theme === 'dark' ? '#141414' : '#fafafa');
}
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      columns:state.columns,tasks:state.tasks,activity:state.activity,theme:state.theme,
      projectTitle:state.projectTitle,lastModified:state.lastModified
    }));
  } catch (error) {
    console.error('Taskforge could not save:', error);
    if (!saveErrorShown) { saveErrorShown = true; toast('Could not save changes. Browser storage may be full or unavailable.'); }
  }
}
function markChanged() { state.lastModified = Date.now(); save(); }
function log(message) { state.activity.unshift({text:message,at:Date.now()}); state.activity = state.activity.slice(0,40); }
function toast(message) {
  document.querySelector('.toast')?.remove();
  const element = document.createElement('div'); element.className = 'toast'; element.setAttribute('role','status'); element.textContent = message;
  document.body.append(element); clearTimeout(toastTimer); toastTimer = setTimeout(()=>element.remove(),3000);
}
function formatDate(value) {
  if (!value) return 'No date';
  const date = new Date(`${value}T00:00:00`);
  return Number.isNaN(date.getTime()) ? 'No date' : date.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function relativeTime(timestamp) {
  if (!timestamp) return 'Not yet updated';
  const elapsed = Math.max(0,Date.now()-timestamp);
  if (elapsed < 60000) return 'Updated just now';
  if (elapsed < 3600000) return `Updated ${Math.floor(elapsed/60000)} min ago`;
  if (elapsed < 86400000) return `Updated ${Math.floor(elapsed/3600000)} hr ago`;
  return `Updated ${new Date(timestamp).toLocaleDateString()}`;
}
function filteredTasks() {
  return state.tasks.filter(task => (!state.search || `${task.title} ${task.description}`.toLowerCase().includes(state.search.toLowerCase())) && (state.filter === 'All' || task.priority === state.filter));
}
function closeMenus(except = null) {
  document.querySelectorAll('details[open]').forEach(menu => { if (menu !== except) menu.open = false; });
}

// 4. Render functions
function menu(task) {
  const moves = state.columns.filter(column=>column.id!==task.columnId).map(column=>`<button data-act="move" data-id="${esc(task.id)}" data-col="${esc(column.id)}">${ic('arrow',14)} Move to ${esc(column.title)}</button>`).join('');
  return `<details class="task-menu"><summary class="icon-btn more" aria-label="More options">${ic('dots')}</summary><div class="menu"><button data-act="edit" data-focus-key="edit-${esc(task.id)}" data-id="${esc(task.id)}">${ic('edit',14)} Edit</button>${moves}<button class="danger" data-act="delete" data-id="${esc(task.id)}">${ic('trash',14)} Delete</button></div></details>`;
}
function taskCard(task) {
  const complete = isTaskDone(task);
  const overdue = task.dueDate && task.dueDate < today() && !complete;
  const doneAvailable = Boolean(doneColumn());
  return `<article class="task ${complete?'done':''}" draggable="true" data-task="${esc(task.id)}">
    <div class="task-top"><i class="task-color" style="background:${esc(task.color||'#0f6cbd')}" aria-hidden="true"></i>
    <button class="complete ${complete?'checked':''}" data-act="complete" data-focus-key="complete-${esc(task.id)}" data-id="${esc(task.id)}" aria-label="Mark ${complete?'incomplete':'complete'}" ${doneAvailable?'':'disabled title="Add a Done column to enable completion"'}>${ic('check',11)}</button>
    <div class="task-title">${esc(task.title)}</div>${menu(task)}</div>
    ${task.description?`<p class="task-desc">${esc(task.description)}</p>`:''}
    <div class="task-footer"><span class="due ${overdue?'overdue':''}">${ic('calendar',12)}${esc(formatDate(task.dueDate))}</span><span class="badge ${task.priority.toLowerCase()}">${task.priority}</span></div>
  </article>`;
}
function columnMarkup(column, tasks) {
  const columnTasks = tasks.filter(task=>task.columnId===column.id);
  const emptyMessage = state.search || state.filter!=='All' ? 'No matching tasks' : 'No tasks in this column';
  return `<section class="column" data-column="${esc(column.id)}"><header class="column-head">
    <div class="column-title"><i class="column-dot" style="background:${esc(column.accent)}"></i>${esc(column.title)} <span class="column-count">${columnTasks.length}</span></div>
    <div class="column-actions"><button class="icon-btn" data-act="new" data-col="${esc(column.id)}" aria-label="Add task">${ic('plus',15)}</button>
    <details class="task-menu"><summary class="icon-btn" aria-label="Column options">${ic('dots',15)}</summary><div class="menu"><button data-act="rename-col" data-id="${esc(column.id)}">${ic('edit',14)} Rename</button><button class="danger" data-act="delete-col" data-id="${esc(column.id)}">${ic('trash',14)} Delete column</button></div></details></div></header>
    <div class="cards" data-drop="${esc(column.id)}">${columnTasks.map(taskCard).join('')||`<div class="empty">${emptyMessage}</div>`}</div>
    <button class="add-card" data-act="new" data-col="${esc(column.id)}">${ic('plus',14)} Add a task</button></section>`;
}
function boardMarkup(tasks) {
  if (state.groupByPriority) {
    return `<div class="board-wrap"><div class="board grouped-priority">${PRIORITIES.map(priority=>`<section class="priority-group"><h3>${priority} priority</h3><div class="cards" data-priority-drop="${priority}">${tasks.filter(task=>task.priority===priority).map(taskCard).join('')||'<div class="empty">No matching tasks</div>'}</div></section>`).join('')}</div></div>`;
  }
  return `<div class="board-wrap"><div class="board">${state.columns.map(column=>columnMarkup(column,tasks)).join('')}<button class="add-column" data-act="add-col">${ic('plus',15)} Add column</button></div></div>`;
}
function gridMarkup(tasks) {
  return `<div class="view-panel"><div class="grid-scroll"><table class="grid-table"><thead><tr><th>Task</th><th>Status</th><th>Priority</th><th>Due date</th><th>Actions</th></tr></thead><tbody>
    ${tasks.map(task=>{const overdue=task.dueDate&&task.dueDate<today()&&!isTaskDone(task);return `<tr><td>${esc(task.title)}</td><td>${esc(state.columns.find(column=>column.id===task.columnId)?.title||'')}</td><td><span class="badge ${task.priority.toLowerCase()}">${task.priority}</span></td><td class="${overdue?'overdue':''}">${esc(formatDate(task.dueDate))}</td><td><button class="icon-btn" data-act="edit" data-focus-key="edit-${esc(task.id)}" data-id="${esc(task.id)}" aria-label="Edit task">${ic('edit',14)}</button><select aria-label="Move task" data-grid-move="${esc(task.id)}"><option value="">Move…</option>${state.columns.filter(c=>c.id!==task.columnId).map(c=>`<option value="${esc(c.id)}">${esc(c.title)}</option>`).join('')}</select><button class="icon-btn" data-act="delete" data-id="${esc(task.id)}" aria-label="Delete task">${ic('trash',14)}</button></td></tr>`}).join('')||`<tr><td colspan="5" class="empty">${state.search||state.filter!=='All'?'No matching tasks':'No tasks yet'}</td></tr>`}
  </tbody></table></div></div>`;
}
function chartsMarkup() {
  const total=state.tasks.length;
  return `<div class="view-panel"><h3 style="font-size:14px;margin:2px 0 12px">Tasks by status</h3><div class="chart-bars">${state.columns.map(column=>{const count=state.tasks.filter(task=>task.columnId===column.id).length;return `<div class="chart-item"><strong>${count}</strong><div class="bar" style="height:${Math.max(2,count/Math.max(1,total)*125)}px"></div>${esc(column.title)}</div>`}).join('')}</div></div>`;
}
function activityMarkup() {
  return `<div class="view-panel">${state.activity.map(item=>`<div class="activity-row">${esc(item.text)}<time>${new Date(item.at).toLocaleString()}</time></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div>`;
}
function render() {
  const boardScroll=document.querySelector('.board-wrap')?.scrollLeft ?? 0;
  const cardScroll=new Map([...document.querySelectorAll('.cards')].map((element,index)=>[element.dataset.drop||element.dataset.priorityDrop||String(index),element.scrollTop]));
  const focused=document.activeElement?.dataset?.focusKey;
  const selectionStart=document.activeElement?.id==='search'?document.activeElement.selectionStart:null;
  const tasks=filteredTasks();
  const total=state.tasks.length;
  const done=state.tasks.filter(isTaskDone).length;
  const late=state.tasks.filter(task=>task.dueDate&&task.dueDate<today()&&!isTaskDone(task)).length;
  const percent=total?Math.round(done/total*100):0;
  const body=state.view==='board'?boardMarkup(tasks):state.view==='grid'?gridMarkup(tasks):state.view==='charts'?chartsMarkup():activityMarkup();
  document.querySelector('#app').innerHTML=`<header class="shell"><div class="brand"><span class="brand-mark">t</span>Taskforge</div><div class="shell-right"><span class="shell-caption">Studio workspace</span><button class="icon-btn" data-act="theme" data-focus-key="theme" aria-label="Toggle theme">${ic(state.theme==='dark'?'sun':'moon')}</button></div></header>
    <div class="layout"><aside class="rail"><div class="workspace"><span class="workspace-avatar">S</span><div><strong>Studio workspace</strong><small>Personal space</small></div></div><div class="nav-label">WORKSPACE</div>
    <button class="nav-item ${state.view!=='activity'?'active':''}" data-act="board-view" data-focus-key="nav-board">${ic('board')}<span>Project board</span><span class="nav-count">${total}</span></button>
    <button class="nav-item ${state.view==='activity'?'active':''}" data-act="activity" data-focus-key="nav-activity">${ic('chart')}<span>Activity</span></button>
    <div class="rail-bottom">Taskforge<br>Changes are saved on this device.</div></aside><main class="main">
    <div class="breadcrumbs">Workspace <span>/</span> <strong>${esc(state.projectTitle)}</strong></div>
    <div class="project-head"><div><div class="head-meta">PERSONAL PROJECT · ${esc(relativeTime(state.lastModified).toUpperCase())}</div><input class="project-title-input" aria-label="Project title" data-project-title maxlength="60" value="${esc(state.projectTitle)}"><p>A clear place to plan the work and keep things moving.</p></div>
    <div class="head-actions"><button class="btn" data-act="import">${ic('download',14)} Import</button><button class="btn" data-act="export">${ic('download',14)} Export</button><input type="file" id="import-file" accept="application/json,.json" hidden></div></div>
    <nav class="pivots"><button class="pivot ${state.view==='board'?'active':''}" data-view="board" data-focus-key="pivot-board">Board</button><button class="pivot ${state.view==='grid'?'active':''}" data-view="grid" data-focus-key="pivot-grid">Grid</button><button class="pivot ${state.view==='charts'?'active':''}" data-view="charts" data-focus-key="pivot-charts">Charts</button></nav>
    <section class="stats"><div class="stat"><span class="stat-label">Total tasks</span><strong class="stat-value">${total}</strong><span class="stat-foot">Across all columns</span></div><div class="stat"><span class="stat-label">Completed</span><strong class="stat-value">${done}</strong><span class="stat-foot">${percent}% of all tasks</span></div><div class="stat"><span class="stat-label">Overdue</span><strong class="stat-value">${late}</strong><span class="stat-foot">${late?'Needs attention':'Nothing overdue'}</span></div><div class="stat"><span class="stat-label">Overall progress</span><strong class="stat-value">${percent}%</strong><div class="progress-line"><span style="width:${percent}%"></span></div></div></section>
    <div class="commandbar"><button class="btn primary" data-act="new" data-focus-key="add-task">${ic('plus',15)} Add task</button><span class="separator"></span><button class="btn" data-act="focus-filter">${ic('filter',15)} Filter</button><select id="filter" aria-label="Filter by priority" data-focus-key="priority-filter"><option ${state.filter==='All'?'selected':''}>All</option><option ${state.filter==='High'?'selected':''}>High</option><option ${state.filter==='Medium'?'selected':''}>Medium</option><option ${state.filter==='Low'?'selected':''}>Low</option></select><span class="separator"></span><button class="btn" data-act="group" data-focus-key="group-priority">${ic('list',15)} ${state.groupByPriority?'Group by column':'Group by priority'}</button><span class="spacer"></span><label style="display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px">${ic('search',14)}<input id="search" data-focus-key="search" placeholder="Search tasks" value="${esc(state.search)}" style="width:125px;border:0;background:transparent;color:inherit;outline:none"></label></div>${body}</main></div>${state.modal?modalHTML():''}`;
  applyTheme(); save();
  if(boardScroll) document.querySelector('.board-wrap')?.scrollTo({left:boardScroll});
  document.querySelectorAll('.cards').forEach((element,index)=>{const key=element.dataset.drop||element.dataset.priorityDrop||String(index);element.scrollTop=cardScroll.get(key)||0;});
  if(focused){const target=document.querySelector(`[data-focus-key="${CSS.escape(focused)}"]`);target?.focus({preventScroll:true});if(target?.id==='search'&&selectionStart!==null)target.setSelectionRange(selectionStart,selectionStart);}
}

// 5. Dialogs and import/export
function modalHTML() {
  const close='<button class="icon-btn" type="button" data-act="close" aria-label="Close">'+ic('close')+'</button>';
  if(state.modalMode==='column') {
    const column=state.modalData?.column;
    return `<div class="modal-backdrop" data-act="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-head"><h2 id="dialog-title">${column?'Rename column':'Add column'}</h2>${close}</header><form id="columnform" class="form"><label class="field">Column name<input name="name" maxlength="30" required autofocus value="${esc(column?.title||'')}" placeholder="Enter a column name"></label><div class="modal-foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">${column?'Save changes':'Add column'}</button></div></form></section></div>`;
  }
  if(state.modalMode==='confirm') {
    const data=state.modalData;
    return `<div class="modal-backdrop" data-act="backdrop"><section class="modal" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description"><header class="modal-head"><h2 id="dialog-title">${esc(data.title)}</h2>${close}</header><div class="form"><p id="dialog-description" class="dialog-copy">${esc(data.message)}</p><div class="modal-foot"><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn danger-btn" data-act="confirm-action">${esc(data.confirmLabel||'Delete')}</button></div></div></section></div>`;
  }
  const task=state.edit||{title:'',description:'',priority:'Medium',dueDate:'',columnId:state.defaultCol||state.columns[0]?.id,color:'#0f6cbd'};
  return `<div class="modal-backdrop" data-act="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-head"><h2 id="dialog-title">${state.edit?'Edit task':'Create task'}</h2>${close}</header><form id="taskform" class="form"><label class="field">Task title<input name="title" maxlength="90" required autofocus value="${esc(task.title)}" placeholder="Enter a task title"></label><label class="field">Description<textarea name="description" maxlength="500" placeholder="Add useful context">${esc(task.description)}</textarea></label><div class="form-row"><label class="field">Priority<select name="priority">${PRIORITIES.map(priority=>`<option ${priority===task.priority?'selected':''}>${priority}</option>`).join('')}</select></label><label class="field">Due date<input name="dueDate" type="date" value="${esc(task.dueDate)}"></label></div><label class="field">Column<select name="columnId">${state.columns.map(column=>`<option value="${esc(column.id)}" ${column.id===task.columnId?'selected':''}>${esc(column.title)}</option>`).join('')}</select></label><label class="field task-color-picker">Task color <select name="color">${TASK_COLORS.map(color=>`<option value="${color}" ${color===(task.color||'#0f6cbd')?'selected':''}>${color}</option>`).join('')}</select></label><div class="modal-foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">${state.edit?'Save changes':'Create task'}</button></div></form></section></div>`;
}
function openDialog(mode,data=null) {
  state.modal=true; state.modalMode=mode; state.modalData=data; render();
  const selector=mode==='column'?'[name=name]':mode==='task'?'[name=title]':'[data-act=confirm-action]';
  document.querySelector(selector)?.focus();
}
function closeDialog() { state.modal=false; state.modalMode='task'; state.modalData=null; state.edit=null; render(); }
function runConfirmedAction() {
  const data=state.modalData; if(!data) return;
  if(data.kind==='delete-task') { state.tasks=state.tasks.filter(task=>task.id!==data.id); log(`Deleted ${data.label}`); }
  if(data.kind==='delete-column') {
    state.tasks.forEach(task=>{if(task.columnId===data.id) task.columnId=data.target.id;});
    state.columns=state.columns.filter(column=>column.id!==data.id); log(`Deleted column ${data.label}`);
  }
  state.modal=false; state.modalData=null; markChanged(); render(); toast('Changes saved');
}
function openModal(id=null,columnId=null) {
  state.edit=id?state.tasks.find(task=>task.id===id):null;
  state.defaultCol=columnId||state.edit?.columnId||state.columns.find(column=>!column.isDone)?.id||state.columns[0]?.id;
  openDialog('task');
}
function exportData() {
  const backup={columns:state.columns,tasks:state.tasks,activity:state.activity,theme:state.theme,projectTitle:state.projectTitle,lastModified:state.lastModified};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const link=document.createElement('a');
  link.href=url; link.download='taskforge-backup.json'; link.click(); URL.revokeObjectURL(url);
}
async function importData(file) {
  try {
    const parsed=JSON.parse(await file.text());
    const imported=validateData(parsed);
    if(!window.confirm('Import this backup and replace the current Taskforge data? This cannot be undone.')) return;
    state.columns=imported.columns; state.tasks=imported.tasks; state.activity=imported.activity;
    state.theme=imported.theme||state.theme; state.projectTitle=imported.projectTitle; state.lastModified=Date.now();
    state.search=''; state.filter='All'; state.view='board'; state.groupByPriority=false;
    save(); render(); toast('Backup imported successfully.');
  } catch(error) { console.error(error); toast(`Import failed: ${error.message||'Invalid JSON file.'}`); }
}

// 6. Event handlers (delegated so they survive render())
document.addEventListener('click',event=>{
  const summary=event.target.closest('summary');
  if(summary?.closest('details')) {
    const details=summary.closest('details');
    if(!details.open) closeMenus(details);
  } else if(!event.target.closest('details')) closeMenus();
  const button=event.target.closest('[data-act]'); if(!button) return;
  const {act,id,col}=button.dataset;
  if(act==='backdrop'&&event.target!==button) return;
  if(act==='backdrop'||act==='close'){closeDialog();return;}
  if(act==='confirm-action'){runConfirmedAction();return;}
  if(act==='new'){openModal(null,col);return;}
  if(act==='edit'){openModal(id);return;}
  if(act==='complete') {
    const task=state.tasks.find(item=>item.id===id); const done=doneColumn(); if(!task||!done) return;
    if(isTaskDone(task)) {
      const previous=state.columns.find(column=>column.id===task.previousColumnId&&!column.isDone);
      task.columnId=previous?.id||firstOpenColumn()?.id||task.columnId; delete task.previousColumnId;
      log(`${task.title} marked incomplete`);
    } else { task.previousColumnId=task.columnId; task.columnId=done.id; log(`${task.title} marked complete`); }
    markChanged(); render(); return;
  }
  if(act==='move') {
    const task=state.tasks.find(item=>item.id===id); const column=state.columns.find(item=>item.id===col);
    if(task&&column){task.columnId=col;if(!column.isDone) delete task.previousColumnId;log(`Moved ${task.title} to ${column.title}`);markChanged();render();} return;
  }
  if(act==='delete') {const task=state.tasks.find(item=>item.id===id);if(task)openDialog('confirm',{title:'Delete task?',message:`Delete “${task.title}”? This action cannot be undone.`,confirmLabel:'Delete task',kind:'delete-task',id:task.id,label:task.title});return;}
  if(act==='rename-col'){const column=state.columns.find(item=>item.id===id);if(column)openDialog('column',{column});return;}
  if(act==='delete-col') {
    const column=state.columns.find(item=>item.id===id);
    if(column?.isDone&&state.columns.filter(item=>item.isDone).length===1){toast('You must keep at least one Done column.');return;}
    if(state.columns.length<2){toast('At least one column is required.');return;}
    const target=state.columns.find(item=>item.id!==id);
    if(column&&target)openDialog('confirm',{title:'Delete column?',message:`Delete “${column.title}”? Its tasks will be moved to “${target.title}”. This action cannot be undone.`,confirmLabel:'Delete column',kind:'delete-column',id:column.id,label:column.title,target});return;
  }
  if(act==='add-col'){openDialog('column');return;}
  if(act==='theme'){state.theme=state.theme==='dark'?'light':'dark';applyTheme();markChanged();render();return;}
  if(act==='activity'){state.view='activity';render();return;}
  if(act==='board-view'){state.view='board';render();return;}
  if(act==='export'){exportData();toast('Backup exported');return;}
  if(act==='import'){document.querySelector('#import-file')?.click();return;}
  if(act==='focus-filter'){document.querySelector('#filter')?.focus();return;}
  if(act==='group'){state.groupByPriority=!state.groupByPriority;render();return;}
});
document.addEventListener('click',event=>{
  const tab=event.target.closest('[data-view]');
  if(tab){state.view=tab.dataset.view;render();}
});
document.addEventListener('change',event=>{
  if(event.target.id==='filter'){state.filter=event.target.value;render();}
  if(event.target.matches('[data-grid-move]') && event.target.value){const task=state.tasks.find(item=>item.id===event.target.dataset.gridMove);const column=state.columns.find(item=>item.id===event.target.value);if(task&&column){task.columnId=column.id;delete task.previousColumnId;log(`Moved ${task.title} to ${column.title}`);markChanged();render();}}
  if(event.target.id==='import-file'){const file=event.target.files?.[0];if(file)importData(file);event.target.value='';}
});
document.addEventListener('input',event=>{
  if(event.target.id==='search'){
    const input=event.target;const value=input.value;const position=input.selectionStart;
    state.search=value;render();const replacement=document.querySelector('#search');
    replacement?.focus();replacement?.setSelectionRange(position,position);
  }
  if(event.target.matches('[data-project-title]')){
    state.projectTitle=event.target.value.slice(0,60)||'Untitled project';
    const breadcrumb=document.querySelector('.breadcrumbs strong');if(breadcrumb)breadcrumb.textContent=state.projectTitle;
    markChanged();
  }
});
document.addEventListener('change',event=>{
  if(event.target.matches('[data-project-title]')){state.projectTitle=event.target.value.trim().slice(0,60)||'Untitled project';markChanged();render();}
});
document.addEventListener('submit',event=>{
  if(!['taskform','columnform'].includes(event.target.id)) return;
  event.preventDefault();const form=event.target;const values=new FormData(form);
  if(form.id==='columnform'){
    const name=String(values.get('name')||'').trim().slice(0,30);if(!name){form.elements.name.focus();return;}
    const column=state.modalData?.column;
    if(column){column.title=name;log(`Renamed column to ${name}`);}
    else {state.columns.push({id:uid(),title:name,accent:'#8a8886',isDone:false});log(`Added column ${name}`);}
    state.modal=false;state.modalData=null;markChanged();render();toast('Column saved');return;
  }
  const title=String(values.get('title')||'').trim();if(!title){form.elements.title.focus();return;}
  const columnId=String(values.get('columnId'));
  if(!state.columns.some(column=>column.id===columnId)){toast('Choose a valid column.');return;}
  const taskData={title,description:String(values.get('description')||'').trim(),priority:PRIORITIES.includes(String(values.get('priority')))?String(values.get('priority')):'Medium',dueDate:String(values.get('dueDate')||''),columnId,color:TASK_COLORS.includes(String(values.get('color')))?String(values.get('color')):'#0f6cbd'};
  if(state.edit){Object.assign(state.edit,taskData);log(`Updated ${title}`);}
  else {state.tasks.unshift({id:uid(),...taskData});log(`Created ${title}`);}
  state.modal=false;state.modalData=null;state.edit=null;markChanged();render();toast('Task saved');
});
// Drag between columns remains supported on pointer/desktop devices.
document.addEventListener('dragstart',event=>{
  const card=event.target.closest('[data-task]');if(!card)return;
  state.drag=card.dataset.task;event.dataTransfer.setData('text/plain',state.drag);event.dataTransfer.effectAllowed='move';
});
document.addEventListener('dragover',event=>{
  const zone=event.target.closest('[data-drop]');if(zone){event.preventDefault();zone.classList.add('dragover');}
});
document.addEventListener('dragleave',event=>{
  const zone=event.target.closest('[data-drop]');if(zone&&!zone.contains(event.relatedTarget))zone.classList.remove('dragover');
});
document.addEventListener('drop',event=>{
  const zone=event.target.closest('[data-drop]');if(!zone||!state.drag)return;
  event.preventDefault();const task=state.tasks.find(item=>item.id===state.drag);
  if(task){task.columnId=zone.dataset.drop;delete task.previousColumnId;log(`Moved ${task.title} to ${state.columns.find(column=>column.id===task.columnId)?.title}`);markChanged();}
  state.drag=null;render();
});
document.addEventListener('toggle',event=>{
  const details=event.target;
  if(!(details instanceof HTMLDetailsElement) || !details.open) return;
  const summary=details.querySelector('summary'); const menu=details.querySelector('.menu');
  if(!summary || !menu) return;
  requestAnimationFrame(()=>{
    const anchor=summary.getBoundingClientRect(); const width=menu.offsetWidth; const height=menu.offsetHeight;
    menu.style.left=`${Math.max(8,Math.min(anchor.right-width,window.innerWidth-width-8))}px`;
    menu.style.top=`${Math.max(8,Math.min(anchor.bottom+4,window.innerHeight-height-8))}px`;
  });
},true);
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){if(state.modal)closeDialog();closeMenus();}
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();document.querySelector('#search')?.focus();}
});

// 7. Startup
applyTheme();
render();

</script></body></html>
