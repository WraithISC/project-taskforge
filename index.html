<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafafa">
  <title>Taskforge — Project workspace</title>

  <style>
    /* ---------- Theme variables ---------- */
    :root {
      font-family: 'Segoe UI Variable', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      color-scheme: light;

      --canvas: #fafafa;
      --surface: #fff;
      --rail: #fff;
      --track: #f5f5f5;
      --card: #fff;
      --text: #242424;
      --muted: #616161;
      --border: #e0e0e0;
      --border-strong: #c7c7c7;
      --line: #ededed;
      --hover: #f5f5f5;
      --hover-strong: #f0f0f0;

      --blue: #0f6cbd;
      --blue-hover: #115ea3;
      --blue-pressed: #0c3b5e;
      --focus: #0f6cbd;

      --nav-active-bg: #eff6fc;
      --nav-active-fg: #0f548c;
      --avatar-bg: #e8f2fa;
      --avatar-fg: #0f548c;
      --dragover-bg: #e8f2fa;
      --check-mark: #fff;

      --danger: #b10e1c;
      --danger-border: #e3b4b4;
      --danger-hover-bg: #fdf3f4;

      --high-bg: #fdf3f4;  --high-fg: #b10e1c;  --high-bd: #f1bbbc;
      --med-bg: #fff9f5;   --med-fg: #bc4b09;   --med-bd: #f7d1ba;
      --low-bg: #f1faf1;   --low-fg: #0e700e;   --low-bd: #bbdabb;

      --shadow: 0 1.6px 3.6px rgba(0, 0, 0, .13), 0 .3px .9px rgba(0, 0, 0, .11);
    }

    .dark {
      color-scheme: dark;

      --canvas: #141414;
      --surface: #292929;
      --rail: #1f1f1f;
      --track: #1f1f1f;
      --card: #292929;
      --text: #fff;
      --muted: #adadad;
      --border: #333;
      --border-strong: #555;
      --line: #3b3a39;
      --hover: #333;
      --hover-strong: #3a3a3a;

      --blue: #479ef5;
      --blue-hover: #62abf5;
      --focus: #479ef5;

      --nav-active-bg: #17334b;
      --nav-active-fg: #cfe4fa;
      --avatar-bg: #29445b;
      --avatar-fg: #d5eaff;
      --dragover-bg: #203b50;
      --check-mark: #141414;

      --danger: #ff8a91;
      --danger-border: #74363c;
      --danger-hover-bg: #442326;

      --high-bg: #442326;  --high-fg: #ffb3b8;  --high-bd: #74363c;
      --med-bg: #482b1a;   --med-fg: #ffb98b;   --med-bd: #774323;
      --low-bg: #1e3920;   --low-fg: #9ed89e;   --low-bd: #356438;

      --shadow: 0 1.6px 3.6px rgba(0, 0, 0, .35), 0 .3px .9px rgba(0, 0, 0, .25);
    }

    /* ---------- Base ---------- */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--text);
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; color: inherit; }
    svg { display: block; flex: none; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .app { min-height: 100vh; }
    .empty { font-size: 12px; line-height: 1.5; color: var(--muted); text-align: center; padding: 28px 8px; }

    /* ---------- Top bar ---------- */
    .shell {
      position: sticky;
      top: 0;
      z-index: 5;
      height: 48px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--rail);
      border-bottom: 1px solid var(--border);
    }

    .brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; }

    .brand-mark {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      background: var(--blue);
      color: white;
      border-radius: 3px;
      font-weight: 700;
    }

    .shell-right { display: flex; align-items: center; gap: 10px; }
    .shell-caption { font-size: 12px; color: var(--muted); }

    .icon-btn {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
    }

    .icon-btn:hover { background: var(--hover); color: var(--text); }

    /* ---------- Sidebar ---------- */
    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: calc(100vh - 48px);
    }

    .rail {
      display: flex;
      flex-direction: column;
      padding: 16px 10px;
      background: var(--rail);
      border-right: 1px solid var(--border);
    }

    .workspace {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 9px 17px;
      border-bottom: 1px solid var(--line);
    }

    .workspace-avatar {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      background: var(--avatar-bg);
      color: var(--avatar-fg);
      border-radius: 3px;
      font-weight: 600;
    }

    .workspace strong { display: block; font-size: 13px; font-weight: 600; }
    .workspace small { font-size: 11px; color: var(--muted); }

    .nav-label {
      padding: 18px 10px 7px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .07em;
      color: var(--muted);
    }

    .nav-item {
      height: 34px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      text-align: left;
    }

    .nav-item:hover { background: var(--hover); }

    .nav-item.active {
      position: relative;
      background: var(--nav-active-bg);
      color: var(--nav-active-fg);
      font-weight: 600;
    }

    .nav-item.active::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 5px;
      bottom: 5px;
      width: 3px;
      background: var(--blue);
    }

    .nav-count { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .rail-bottom {
      margin-top: auto;
      padding: 13px 8px 0;
      border-top: 1px solid var(--line);
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
    }

    /* ---------- Page header ---------- */
    .main { min-width: 0; padding: 0 26px 26px; }

    .breadcrumbs {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      color: var(--muted);
    }

    .breadcrumbs strong { font-weight: 400; color: var(--text); }

    .project-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 0 15px;
    }

    .head-meta { margin-bottom: 5px; font-size: 11px; color: var(--muted); }
    .project-title { margin: 0 0 3px; line-height: 24px; }
    .project-head p { margin: 0; font-size: 12px; color: var(--muted); }
    .head-actions { display: flex; align-items: center; gap: 6px; }

    .project-title-input {
      width: min(420px, 100%);
      padding: 0;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 18px;
      font-weight: 600;
    }

    .project-title-input:focus { outline: 0; border-bottom-color: var(--focus); }

    /* ---------- Buttons ---------- */
    .btn {
      height: 30px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface);
      font-size: 12px;
      font-weight: 600;
    }

    .btn:hover { background: var(--hover); }

    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover { background: var(--blue-hover); }
    .btn.primary:active { background: var(--blue-pressed); }

    .danger-btn { color: var(--danger); border-color: var(--danger-border); }
    .danger-btn:hover { background: var(--danger-hover-bg); }

    /* ---------- View tabs ---------- */
    .pivots {
      height: 38px;
      display: flex;
      align-items: stretch;
      gap: 18px;
      border-bottom: 1px solid var(--border);
    }

    .pivot {
      position: relative;
      padding: 0 7px;
      border: 0;
      background: transparent;
      font-size: 13px;
      color: var(--muted);
    }

    .pivot:hover { color: var(--text); }
    .pivot.active { color: var(--blue); font-weight: 600; }

    .pivot.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--blue);
    }

    /* ---------- Stats ---------- */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 9px;
      padding: 14px 0 16px;
    }

    .stat {
      min-height: 70px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .stat-label { display: block; margin-bottom: 5px; font-size: 11px; color: var(--muted); }
    .stat-value { font-size: 19px; font-weight: 600; line-height: 22px; font-variant-numeric: tabular-nums; }
    .stat-foot { margin-left: 7px; font-size: 11px; color: var(--muted); }
    .progress-line { height: 4px; margin-top: 8px; background: var(--track); }
    .progress-line span { display: block; height: 100%; background: var(--blue); }

    /* ---------- Command bar ---------- */
    .commandbar {
      height: 40px;
      padding: 0 7px;
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: 0;
    }

    .commandbar .btn { height: 28px; border: 0; background: transparent; font-weight: 400; }
    .commandbar .btn:hover { background: var(--hover-strong); }
    .commandbar .btn.primary { background: var(--blue); color: #fff; font-weight: 600; }
    .commandbar .btn.primary:hover { background: var(--blue-hover); }
    .commandbar .separator { width: 1px; height: 20px; margin: 0 5px; background: var(--border); }
    .commandbar .spacer { flex: 1; }

    .commandbar select {
      height: 27px;
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 12px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 4px;
      border-radius: 3px;
      font-size: 12px;
      color: var(--muted);
    }

    .search-box:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }

    .search-box input {
      width: 125px;
      border: 0;
      outline: none;
      background: transparent;
      color: inherit;
    }

    /* ---------- Board ---------- */
    .board-wrap {
      min-height: 390px;
      padding: 12px;
      overflow-x: auto;
      background: var(--track);
      border: 1px solid var(--border);
    }

    .board { display: flex; align-items: flex-start; gap: 10px; min-width: max-content; }

    .board.grouped-priority {
      display: grid;
      grid-template-columns: repeat(3, 252px);
    }

    .column {
      width: 252px;
      min-height: 220px;
      max-height: calc(100vh - 350px);
      display: flex;
      flex-direction: column;
    }

    .column-head {
      height: 34px;
      padding: 0 3px 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .column-title { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
    .column-dot { width: 8px; height: 8px; border-radius: 50%; }
    .column-count { font-size: 11px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
    .column-actions { display: flex; gap: 1px; }
    .column-actions .icon-btn { width: 25px; height: 25px; }

    .cards {
      min-height: 165px;
      padding: 1px 2px 6px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      overflow-y: auto;
      border-radius: 3px;
    }

    .cards.dragover { background: var(--dragover-bg); outline: 1px dashed var(--blue); }

    .priority-group { min-height: 200px; display: flex; flex-direction: column; gap: 8px; }
    .priority-group h3 { margin: 0; padding: 7px 4px; font-size: 13px; border-bottom: 1px solid var(--border); }

    .add-card,
    .add-column {
      display: flex;
      align-items: center;
      border: 1px dashed var(--border-strong);
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }

    .add-card:hover,
    .add-column:hover { background: var(--surface); color: var(--blue); border-color: var(--blue); }

    .add-card { height: 29px; margin: 2px; padding: 0 8px; gap: 6px; }
    .add-column { height: 34px; min-width: 145px; padding: 0 10px; gap: 7px; }

    /* ---------- Task card ---------- */
    .task {
      padding: 9px 9px 7px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: inset 3px 0 0 var(--task-color, transparent), var(--shadow);
      transition: background .12s, border-color .12s;
    }

    .task:hover { background: var(--hover); border-color: var(--border-strong); }

    .task-top { display: flex; align-items: flex-start; gap: 7px; }

    .task-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; line-height: 18px; overflow-wrap: anywhere; }
    .task.done .task-title { text-decoration: line-through; color: var(--muted); }

    .complete {
      width: 16px;
      height: 16px;
      margin-top: 1px;
      padding: 0;
      display: grid;
      place-items: center;
      flex: none;
      border: 1px solid #8a8886;
      border-radius: 50%;
      background: transparent;
      color: transparent;
    }

    .complete:hover { border-color: var(--blue); color: var(--blue); }
    .complete.checked { background: var(--blue); border-color: var(--blue); color: var(--check-mark); }
    .complete:disabled { opacity: .5; cursor: not-allowed; }

    .task-desc {
      margin: 5px 0 8px 23px;
      font-size: 12px;
      line-height: 17px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .task-footer {
      min-height: 23px;
      margin: 9px 0 0 23px;
      padding-top: 7px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px solid var(--line);
    }

    .due { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .due.overdue { color: var(--danger); }

    .badge { padding: 0 5px; border: 1px solid; border-radius: 2px; font-size: 10px; font-weight: 600; line-height: 16px; }
    .badge.high { background: var(--high-bg); color: var(--high-fg); border-color: var(--high-bd); }
    .badge.medium { background: var(--med-bg); color: var(--med-fg); border-color: var(--med-bd); }
    .badge.low { background: var(--low-bg); color: var(--low-fg); border-color: var(--low-bd); }

    /* ---------- Dropdown menus ---------- */
    .more { opacity: 0; transition: opacity .12s; }
    .task:hover .more,
    .task:focus-within .more,
    .menu-wrap[open] .more { opacity: 1; }

    @media (hover: none) { .more { opacity: 1; } }

    .menu-wrap summary { list-style: none; }
    .menu-wrap summary::-webkit-details-marker { display: none; }

    /* Fixed positioning keeps menus from being clipped by scrolling columns. */
    .menu {
      position: fixed;
      z-index: 30;
      width: 160px;
      max-height: min(60vh, 360px);
      padding: 4px;
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    .menu button {
      width: 100%;
      height: 29px;
      padding: 0 7px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 0;
      border-radius: 2px;
      background: transparent;
      font-size: 12px;
      text-align: left;
    }

    .menu button:hover { background: var(--hover); }
    .menu .danger { color: var(--danger); }

    /* ---------- Grid, chart and activity views ---------- */
    .view-panel { min-height: 240px; padding: 12px; background: var(--surface); border: 1px solid var(--border); }
    .grid-scroll { max-width: 100%; overflow-x: auto; }

    .grid-table { width: 100%; min-width: 680px; border-collapse: collapse; font-size: 12px; }
    .grid-table th { text-align: left; font-weight: 600; color: var(--muted); background: var(--track); }
    .grid-table th, .grid-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
    .grid-table tr:hover td { background: var(--hover); }
    .grid-table td.overdue { color: var(--danger); }
    .grid-table select { max-width: 110px; font-size: 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 3px; }
    .row-actions { display: flex; align-items: center; gap: 4px; }

    .chart-title { margin: 2px 0 12px; font-size: 14px; }
    .chart-bars { height: 170px; padding: 15px; display: flex; align-items: flex-end; gap: 16px; }
    .chart-item { width: 90px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
    .bar { width: 35px; min-height: 2px; background: var(--blue); }

    .activity-row { padding: 11px 4px; border-bottom: 1px solid var(--line); font-size: 12px; }
    .activity-row time { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }

    /* ---------- Dialogs and toast ---------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      padding: 15px;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, .32);
    }

    .modal {
      width: min(470px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    .modal-head {
      padding: 15px 17px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .modal-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .form { padding: 15px 17px; }
    .dialog-copy { margin: 0; font-size: 13px; line-height: 1.55; color: var(--muted); }

    .field { display: block; margin-bottom: 12px; font-size: 12px; font-weight: 600; }

    .field input,
    .field textarea,
    .field select {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 7px 8px;
      border: 1px solid #8a8886;
      border-radius: 3px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 400;
    }

    .field textarea { min-height: 74px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 7px; padding-top: 5px; }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: 12px;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 900px) {
      .layout { grid-template-columns: 58px minmax(0, 1fr); }
      .rail { padding: 13px 7px; }
      .workspace { justify-content: center; padding: 7px 0 15px; }
      .workspace-text,
      .nav-label,
      .nav-item span,
      .rail-bottom { display: none; }
      .nav-item { justify-content: center; padding: 0; }
      .nav-item.active::before { left: -7px; }
      .main { padding: 0 16px 20px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .shell { padding: 0 12px; }
      .shell-caption { display: none; }
      .main { padding: 0 10px 18px; }
      .project-head { padding-top: 5px; }
      .project-title-input { font-size: 17px; }
      .stats { gap: 6px; }
      .stat { padding: 8px; }
      .stat-foot { display: block; margin: 3px 0 0; }
      .commandbar { overflow-x: auto; }
      .commandbar .btn { white-space: nowrap; }
      .board-wrap { padding: 8px; }
      .column { width: 245px; }
      .board.grouped-priority { grid-template-columns: repeat(3, 245px); }
      .pivots { gap: 9px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div id="app" class="app"></div>

  <script>
    /* =====================================================
       Taskforge — a small kanban board in vanilla JavaScript
       Flow: user action -> change `state` -> commit() -> render()
       ===================================================== */

    /* ---------- Constants ---------- */
    const STORAGE_KEY = 'taskforge-fluent';
    const DEFAULT_PROJECT_TITLE = 'Product launch';
    const MAX_ACTIVITY = 40;

    const PRIORITIES = ['Low', 'Medium', 'High'];
    const PRIORITY_FILTERS = ['All', 'High', 'Medium', 'Low'];
    const VIEWS = [
      { id: 'board', label: 'Board' },
      { id: 'grid', label: 'Grid' },
      { id: 'charts', label: 'Charts' }
    ];

    const TASK_COLORS = {
      Blue: '#0f6cbd',
      Green: '#0e700e',
      Orange: '#bc4b09',
      Purple: '#8b87b8',
      Red: '#b10e1c',
      Gray: '#8a8886'
    };
    const DEFAULT_COLOR = TASK_COLORS.Blue;
    const DEFAULT_COLUMN_ACCENT = '#8a8886';

    const ICONS = {
      board: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/>',
      list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
      chart: '<path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 5-7"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
      moon: '<path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/>',
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/>',
      dots: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
      calendar: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
      check: '<path d="m5 12 4 4L19 6"/>',
      filter: '<path d="M4 7h16M7 12h10m-7 5h4"/>',
      edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',
      trash: '<path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/>',
      arrow: '<path d="M5 12h14m-7-7 7 7-7 7"/>',
      close: '<path d="m18 6-12 12M6 6l12 12"/>',
      download: '<path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/>',
      upload: '<path d="M12 15V3m-5 5 5-5 5 5M4 20h16"/>'
    };

    function icon(name, size = 16) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.plus}</svg>`;
    }

    /* ---------- Small helpers ---------- */
    function esc(value) {
      const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(value ?? '').replace(/[&<>"']/g, char => entities[char]);
    }

    function uid() {
      if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
      return `id-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    }

    function toDateString(date) {
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${date.getFullYear()}-${month}-${day}`;
    }

    const today = () => toDateString(new Date());

    function daysFromNow(days) {
      const date = new Date();
      date.setDate(date.getDate() + days);
      return toDateString(date);
    }

    function formatDate(dateString) {
      if (!dateString) return 'No date';
      const date = new Date(`${dateString}T00:00:00`);
      if (Number.isNaN(date.getTime())) return 'No date';
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function timeAgo(timestamp) {
      const elapsed = Math.max(0, Date.now() - timestamp);
      const minutes = Math.floor(elapsed / 60000);
      const hours = Math.floor(elapsed / 3600000);

      if (minutes < 1) return 'Updated just now';
      if (minutes < 60) return `Updated ${minutes} min ago`;
      if (hours < 24) return `Updated ${hours} hr ago`;
      return `Updated ${new Date(timestamp).toLocaleDateString()}`;
    }

    /* ---------- Data: defaults, validation, loading ---------- */
    function createSeedData() {
      const task = (id, columnId, title, description, priority, dueInDays) => ({
        id, columnId, title, description, priority,
        dueDate: daysFromNow(dueInDays),
        color: DEFAULT_COLOR,
        previousColumnId: null
      });

      return {
        projectTitle: DEFAULT_PROJECT_TITLE,
        lastModified: Date.now(),
        theme: null,
        columns: [
          { id: 'backlog', title: 'Backlog', accent: '#8a8886', isDone: false },
          { id: 'todo', title: 'To do', accent: '#d6a45e', isDone: false },
          { id: 'progress', title: 'In progress', accent: '#0f6cbd', isDone: false },
          { id: 'review', title: 'Review', accent: '#8b87b8', isDone: false },
          { id: 'done', title: 'Done', accent: '#0e700e', isDone: true }
        ],
        tasks: [
          task('a1', 'todo', 'Map the onboarding flow', 'Outline the first-time experience and identify the screens a new user needs.', 'High', 2),
          task('a2', 'progress', 'Set up project repository', 'Create the repo, agree on a branch convention, and add the initial README.', 'Medium', 1),
          task('a3', 'backlog', 'Collect reference material', 'Gather examples of clear, useful project tools.', 'Low', 7),
          task('a4', 'review', 'Review the component map', 'Check that component boundaries are clear and responsibilities are easy to follow.', 'Medium', -1),
          task('a5', 'done', 'Define the project scope', 'Agree on the first release: boards, tasks, priorities, deadlines, and local persistence.', 'High', -2)
        ],
        activity: []
      };
    }

    // Cleans saved or imported data. Throws if it is unusable; repairs it where it can.
    function validateData(raw) {
      if (!raw || !Array.isArray(raw.columns) || !Array.isArray(raw.tasks)) {
        throw new Error('Backup must contain columns and tasks arrays.');
      }

      const columns = raw.columns.filter(isValidColumn).map(cleanColumn);
      const columnIds = new Set(columns.map(column => column.id));
      if (!columns.length || columnIds.size !== columns.length) {
        throw new Error('Backup has no valid columns or contains duplicate column IDs.');
      }

      // Tasks pointing at a missing column are kept and moved to the first open column.
      const fallbackColumn = columns.find(column => !column.isDone) || columns[0];
      const tasks = raw.tasks
        .filter(isValidTask)
        .map(task => cleanTask(task, columnIds, fallbackColumn.id));

      const activity = Array.isArray(raw.activity)
        ? raw.activity.filter(isValidActivity).slice(0, MAX_ACTIVITY)
        : [];

      const title = typeof raw.projectTitle === 'string' ? raw.projectTitle.trim().slice(0, 60) : '';

      return {
        projectTitle: title || DEFAULT_PROJECT_TITLE,
        lastModified: Number.isFinite(raw.lastModified) ? raw.lastModified : Date.now(),
        theme: raw.theme === 'dark' || raw.theme === 'light' ? raw.theme : null,
        columns,
        tasks,
        activity
      };
    }

    const isValidColumn = column => column && typeof column.id === 'string' && typeof column.title === 'string';
    const isValidTask = task => task && typeof task.id === 'string' && typeof task.title === 'string';
    const isValidActivity = item => item && typeof item.text === 'string' && Number.isFinite(Number(item.at));

    function cleanColumn(column) {
      return {
        id: column.id,
        title: column.title.slice(0, 30),
        accent: /^#[0-9a-f]{6}$/i.test(column.accent) ? column.accent : DEFAULT_COLUMN_ACCENT,
        // Saves from before `isDone` existed marked the finished column by its id.
        isDone: typeof column.isDone === 'boolean' ? column.isDone : column.id === 'done'
      };
    }

    function cleanTask(task, columnIds, fallbackColumnId) {
      return {
        id: task.id,
        columnId: columnIds.has(task.columnId) ? task.columnId : fallbackColumnId,
        title: task.title.slice(0, 90),
        description: typeof task.description === 'string' ? task.description.slice(0, 500) : '',
        priority: PRIORITIES.includes(task.priority) ? task.priority : 'Medium',
        dueDate: /^\d{4}-\d{2}-\d{2}$/.test(task.dueDate) ? task.dueDate : '',
        color: Object.values(TASK_COLORS).includes(task.color) ? task.color : DEFAULT_COLOR,
        previousColumnId: typeof task.previousColumnId === 'string' ? task.previousColumnId : null
      };
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return validateData({ ...createSeedData(), ...JSON.parse(saved) });
      } catch (error) {
        console.warn('Taskforge could not load saved data:', error);
      }
      return createSeedData();
    }

    /* ---------- State ---------- */
    // `state` is saved to localStorage. `ui` is temporary and resets on reload.
    const state = loadState();
    state.theme = state.theme || (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

    const ui = {
      view: 'board',
      search: '',
      filter: 'All',
      groupByPriority: false,
      modal: null,       // { type: 'task' | 'column' | 'confirm', ... }
      dragTaskId: null
    };

    const findTask = id => state.tasks.find(task => task.id === id);
    const findColumn = id => state.columns.find(column => column.id === id);
    const getDoneColumn = () => state.columns.find(column => column.isDone);
    const getFirstOpenColumn = () => state.columns.find(column => !column.isDone);
    const isDone = task => Boolean(findColumn(task.columnId)?.isDone);
    const isOverdue = task => Boolean(task.dueDate) && task.dueDate < today() && !isDone(task);

    function getVisibleTasks() {
      const query = ui.search.toLowerCase();
      return state.tasks.filter(task => {
        const matchesSearch = !query || `${task.title} ${task.description}`.toLowerCase().includes(query);
        const matchesPriority = ui.filter === 'All' || task.priority === ui.filter;
        return matchesSearch && matchesPriority;
      });
    }

    function getStats() {
      const total = state.tasks.length;
      const done = state.tasks.filter(isDone).length;
      const overdue = state.tasks.filter(isOverdue).length;
      const percent = total ? Math.round((done / total) * 100) : 0;
      return { total, done, overdue, percent };
    }

    /* ---------- Saving and feedback ---------- */
    let toastTimer;
    let saveErrorShown = false;

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.error('Taskforge could not save:', error);
        if (!saveErrorShown) {
          saveErrorShown = true;
          toast('Could not save changes. Browser storage may be full or unavailable.');
        }
      }
    }

    // Every data change goes through here: log it, save it, redraw.
    function commit(message) {
      if (message) {
        state.activity.unshift({ text: message, at: Date.now() });
        state.activity = state.activity.slice(0, MAX_ACTIVITY);
      }
      state.lastModified = Date.now();
      save();
      render();
    }

    function toast(message) {
      document.querySelector('.toast')?.remove();

      const element = document.createElement('div');
      element.className = 'toast';
      element.setAttribute('role', 'status');
      element.textContent = message;
      document.body.append(element);

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => element.remove(), 3000);
    }

    function applyTheme() {
      const dark = state.theme === 'dark';
      document.documentElement.classList.toggle('dark', dark);
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#141414' : '#fafafa');
    }

    /* ---------- Rendering: page pieces ---------- */
    function render() {
      const saved = captureViewState();
      const tasks = getVisibleTasks();
      const stats = getStats();

      document.querySelector('#app').innerHTML = `
        ${renderTopBar()}
        <div class="layout">
          ${renderSidebar(stats.total)}
          <main class="main">
            <div class="breadcrumbs">Workspace <span>/</span> <strong>${esc(state.projectTitle)}</strong></div>
            ${renderProjectHeader()}
            ${renderViewTabs()}
            ${renderStats(stats)}
            ${renderCommandBar()}
            ${renderCurrentView(tasks)}
          </main>
        </div>
        ${renderModal()}`;

      applyTheme();
      restoreViewState(saved);
    }

    // Rebuilding the page resets scroll positions and focus, so we save and restore them.
    const cardListKey = element => element.dataset.drop || element.dataset.priorityDrop;

    function captureViewState() {
      const active = document.activeElement;
      return {
        boardScroll: document.querySelector('.board-wrap')?.scrollLeft ?? 0,
        listScroll: new Map([...document.querySelectorAll('.cards')].map(el => [cardListKey(el), el.scrollTop])),
        focusKey: active?.dataset?.focusKey ?? null,
        searchCaret: active?.id === 'search' ? active.selectionStart : null
      };
    }

    function restoreViewState(saved) {
      document.querySelector('.board-wrap')?.scrollTo({ left: saved.boardScroll });
      document.querySelectorAll('.cards').forEach(el => {
        el.scrollTop = saved.listScroll.get(cardListKey(el)) || 0;
      });

      if (!saved.focusKey || ui.modal) return;
      const target = document.querySelector(`[data-focus-key="${CSS.escape(saved.focusKey)}"]`);
      target?.focus({ preventScroll: true });
      if (target?.id === 'search' && saved.searchCaret !== null) {
        target.setSelectionRange(saved.searchCaret, saved.searchCaret);
      }
    }

    function renderTopBar() {
      return `
        <header class="shell">
          <div class="brand"><span class="brand-mark">t</span>Taskforge</div>
          <div class="shell-right">
            <span class="shell-caption">Studio workspace</span>
            <button class="icon-btn" data-act="toggleTheme" data-focus-key="theme" aria-label="Toggle theme">${icon(state.theme === 'dark' ? 'sun' : 'moon')}</button>
          </div>
        </header>`;
    }

    function renderSidebar(taskCount) {
      const onActivity = ui.view === 'activity';
      return `
        <aside class="rail">
          <div class="workspace">
            <span class="workspace-avatar">S</span>
            <div class="workspace-text"><strong>Studio workspace</strong><small>Personal space</small></div>
          </div>
          <div class="nav-label">WORKSPACE</div>
          <button class="nav-item ${onActivity ? '' : 'active'}" data-act="showBoard" data-focus-key="nav-board">
            ${icon('board')}<span>Project board</span><span class="nav-count">${taskCount}</span>
          </button>
          <button class="nav-item ${onActivity ? 'active' : ''}" data-act="showActivity" data-focus-key="nav-activity">
            ${icon('chart')}<span>Activity</span>
          </button>
          <div class="rail-bottom">Taskforge<br>Changes are saved on this device.</div>
        </aside>`;
    }

    const projectMeta = () => `PERSONAL PROJECT · ${timeAgo(state.lastModified).toUpperCase()}`;

    function renderProjectHeader() {
      return `
        <div class="project-head">
          <div>
            <div class="head-meta">${esc(projectMeta())}</div>
            <h1 class="project-title">
              <input class="project-title-input" id="projectTitle" aria-label="Project title" maxlength="60" value="${esc(state.projectTitle)}">
            </h1>
            <p>A clear place to plan the work and keep things moving.</p>
          </div>
          <div class="head-actions">
            <button class="btn" data-act="importBackup">${icon('upload', 14)} Import</button>
            <button class="btn" data-act="exportBackup">${icon('download', 14)} Export</button>
            <input type="file" id="importFile" accept="application/json,.json" hidden>
          </div>
        </div>`;
    }

    function renderViewTabs() {
      const tabs = VIEWS.map(view => `
        <button class="pivot ${ui.view === view.id ? 'active' : ''}" data-view="${view.id}" data-focus-key="pivot-${view.id}">${view.label}</button>`).join('');
      return `<nav class="pivots">${tabs}</nav>`;
    }

    function renderStats({ total, done, overdue, percent }) {
      const card = (label, value, note) => `
        <div class="stat">
          <span class="stat-label">${label}</span>
          <strong class="stat-value">${value}</strong>
          <span class="stat-foot">${note}</span>
        </div>`;

      return `
        <section class="stats">
          ${card('Total tasks', total, 'Across all columns')}
          ${card('Completed', done, `${percent}% of all tasks`)}
          ${card('Overdue', overdue, overdue ? 'Needs attention' : 'Nothing overdue')}
          <div class="stat">
            <span class="stat-label">Overall progress</span>
            <strong class="stat-value">${percent}%</strong>
            <div class="progress-line"><span style="width:${percent}%"></span></div>
          </div>
        </section>`;
    }

    function renderCommandBar() {
      const filterOptions = PRIORITY_FILTERS
        .map(priority => `<option ${ui.filter === priority ? 'selected' : ''}>${priority}</option>`)
        .join('');

      return `
        <div class="commandbar">
          <button class="btn primary" data-act="newTask" data-focus-key="add-task">${icon('plus', 15)} Add task</button>
          <span class="separator"></span>
          <button class="btn" data-act="focusFilter">${icon('filter', 15)} Filter</button>
          <select id="filter" data-focus-key="priority-filter" aria-label="Filter by priority">${filterOptions}</select>
          <span class="separator"></span>
          <button class="btn" data-act="toggleGrouping" data-focus-key="group-toggle">${icon('list', 15)} ${ui.groupByPriority ? 'Group by column' : 'Group by priority'}</button>
          <span class="spacer"></span>
          <label class="search-box">${icon('search', 14)}
            <input id="search" data-focus-key="search" placeholder="Search tasks" value="${esc(ui.search)}">
          </label>
        </div>`;
    }

    function renderCurrentView(tasks) {
      if (ui.view === 'grid') return renderGrid(tasks);
      if (ui.view === 'charts') return renderChart();
      if (ui.view === 'activity') return renderActivity();
      return renderBoard(tasks);
    }

    const emptyListText = () => (ui.search || ui.filter !== 'All' ? 'No matching tasks' : 'No tasks in this column');

    /* ---------- Rendering: board ---------- */
    function renderBoard(tasks) {
      if (ui.groupByPriority) return renderPriorityBoard(tasks);

      const columns = state.columns.map(column => renderColumn(column, tasks)).join('');
      return `
        <div class="board-wrap">
          <div class="board">
            ${columns}
            <button class="add-column" data-act="addColumn">${icon('plus', 15)} Add column</button>
          </div>
        </div>`;
    }

    function renderColumn(column, tasks) {
      const columnTasks = tasks.filter(task => task.columnId === column.id);
      const cards = columnTasks.map(task => renderTaskCard(task)).join('');
      const id = esc(column.id);

      return `
        <section class="column">
          <header class="column-head">
            <div class="column-title">
              <i class="column-dot" style="background:${esc(column.accent)}"></i>${esc(column.title)}
              <span class="column-count">${columnTasks.length}</span>
            </div>
            <div class="column-actions">
              <button class="icon-btn" data-act="newTask" data-col="${id}" aria-label="Add task">${icon('plus', 15)}</button>
              <details class="menu-wrap">
                <summary class="icon-btn" aria-label="Column options">${icon('dots', 15)}</summary>
                <div class="menu">
                  <button data-act="renameColumn" data-id="${id}">${icon('edit', 14)} Rename</button>
                  <button class="danger" data-act="deleteColumn" data-id="${id}">${icon('trash', 14)} Delete column</button>
                </div>
              </details>
            </div>
          </header>
          <div class="cards" data-drop="${id}">${cards || `<div class="empty">${emptyListText()}</div>`}</div>
          <button class="add-card" data-act="newTask" data-col="${id}">${icon('plus', 14)} Add a task</button>
        </section>`;
    }

    function renderPriorityBoard(tasks) {
      const groups = [...PRIORITIES].reverse().map(priority => {
        const cards = tasks
          .filter(task => task.priority === priority)
          .map(task => renderTaskCard(task, false))
          .join('');
        return `
          <section class="priority-group">
            <h3>${priority} priority</h3>
            <div class="cards" data-priority-drop="${priority}">${cards || '<div class="empty">No matching tasks</div>'}</div>
          </section>`;
      }).join('');

      return `<div class="board-wrap"><div class="board grouped-priority">${groups}</div></div>`;
    }

    function renderTaskCard(task, draggable = true) {
      const done = isDone(task);
      const id = esc(task.id);
      const canComplete = Boolean(getDoneColumn());

      return `
        <article class="task ${done ? 'done' : ''}" style="--task-color:${esc(task.color)}" ${draggable ? 'draggable="true"' : ''} data-task="${id}">
          <div class="task-top">
            <button class="complete ${done ? 'checked' : ''}" data-act="toggleComplete" data-id="${id}" data-focus-key="complete-${id}"
              aria-label="Mark ${done ? 'incomplete' : 'complete'}" ${canComplete ? '' : 'disabled title="Add a Done column to enable completion"'}>${icon('check', 11)}</button>
            <div class="task-title">${esc(task.title)}</div>
            ${renderTaskMenu(task)}
          </div>
          ${task.description ? `<p class="task-desc">${esc(task.description)}</p>` : ''}
          <div class="task-footer">
            <span class="due ${isOverdue(task) ? 'overdue' : ''}">${icon('calendar', 12)}${esc(formatDate(task.dueDate))}</span>
            <span class="badge ${task.priority.toLowerCase()}">${task.priority}</span>
          </div>
        </article>`;
    }

    function renderTaskMenu(task) {
      const id = esc(task.id);
      const moveButtons = state.columns
        .filter(column => column.id !== task.columnId)
        .map(column => `<button data-act="moveTask" data-id="${id}" data-col="${esc(column.id)}">${icon('arrow', 14)} Move to ${esc(column.title)}</button>`)
        .join('');

      return `
        <details class="menu-wrap">
          <summary class="icon-btn more" aria-label="More options">${icon('dots')}</summary>
          <div class="menu">
            <button data-act="editTask" data-id="${id}">${icon('edit', 14)} Edit</button>
            ${moveButtons}
            <button class="danger" data-act="deleteTask" data-id="${id}">${icon('trash', 14)} Delete</button>
          </div>
        </details>`;
    }

    /* ---------- Rendering: grid, chart, activity ---------- */
    function renderGrid(tasks) {
      const rows = tasks.map(renderGridRow).join('');
      const emptyRow = `<tr><td colspan="5" class="empty">${ui.search || ui.filter !== 'All' ? 'No matching tasks' : 'No tasks yet'}</td></tr>`;

      return `
        <div class="view-panel">
          <div class="grid-scroll">
            <table class="grid-table">
              <thead><tr><th>Task</th><th>Status</th><th>Priority</th><th>Due date</th><th>Actions</th></tr></thead>
              <tbody>${rows || emptyRow}</tbody>
            </table>
          </div>
        </div>`;
    }

    function renderGridRow(task) {
      const id = esc(task.id);
      const moveOptions = state.columns
        .filter(column => column.id !== task.columnId)
        .map(column => `<option value="${esc(column.id)}">${esc(column.title)}</option>`)
        .join('');

      return `
        <tr>
          <td>${esc(task.title)}</td>
          <td>${esc(findColumn(task.columnId)?.title || '')}</td>
          <td><span class="badge ${task.priority.toLowerCase()}">${task.priority}</span></td>
          <td class="${isOverdue(task) ? 'overdue' : ''}">${esc(formatDate(task.dueDate))}</td>
          <td>
            <div class="row-actions">
              <button class="icon-btn" data-act="editTask" data-id="${id}" data-focus-key="edit-${id}" aria-label="Edit task">${icon('edit', 14)}</button>
              <select data-grid-move="${id}" aria-label="Move task"><option value="">Move…</option>${moveOptions}</select>
              <button class="icon-btn" data-act="deleteTask" data-id="${id}" aria-label="Delete task">${icon('trash', 14)}</button>
            </div>
          </td>
        </tr>`;
    }

    function renderChart() {
      const total = state.tasks.length;
      const bars = state.columns.map(column => {
        const count = state.tasks.filter(task => task.columnId === column.id).length;
        const height = Math.max(2, (count / Math.max(1, total)) * 125);
        return `
          <div class="chart-item">
            <strong>${count}</strong>
            <div class="bar" style="height:${height}px"></div>
            ${esc(column.title)}
          </div>`;
      }).join('');

      return `
        <div class="view-panel">
          <h3 class="chart-title">Tasks by status</h3>
          <div class="chart-bars">${bars}</div>
        </div>`;
    }

    function renderActivity() {
      const rows = state.activity.map(item => `
        <div class="activity-row">${esc(item.text)}<time>${new Date(item.at).toLocaleString()}</time></div>`).join('');
      return `<div class="view-panel">${rows || '<div class="empty">No activity yet.</div>'}</div>`;
    }

    /* ---------- Rendering: dialogs ---------- */
    function renderModal() {
      if (!ui.modal) return '';
      if (ui.modal.type === 'column') return renderColumnModal();
      if (ui.modal.type === 'confirm') return renderConfirmModal();
      return renderTaskModal();
    }

    function modalShell({ title, body, role = 'dialog', describedBy = '' }) {
      return `
        <div class="modal-backdrop" data-act="backdrop">
          <section class="modal" role="${role}" aria-modal="true" aria-labelledby="dialogTitle" ${describedBy}>
            <header class="modal-head">
              <h2 id="dialogTitle">${esc(title)}</h2>
              <button class="icon-btn" type="button" data-act="closeModal" aria-label="Close">${icon('close')}</button>
            </header>
            ${body}
          </section>
        </div>`;
    }

    const cancelButton = '<button type="button" class="btn" data-act="closeModal">Cancel</button>';

    function renderTaskModal() {
      const { task: existing, columnId } = ui.modal;
      const task = existing || { title: '', description: '', priority: 'Medium', dueDate: '', columnId, color: DEFAULT_COLOR };

      const priorityOptions = PRIORITIES
        .map(priority => `<option ${priority === task.priority ? 'selected' : ''}>${priority}</option>`).join('');
      const columnOptions = state.columns
        .map(column => `<option value="${esc(column.id)}" ${column.id === task.columnId ? 'selected' : ''}>${esc(column.title)}</option>`).join('');
      const colorOptions = Object.entries(TASK_COLORS)
        .map(([name, value]) => `<option value="${value}" ${value === task.color ? 'selected' : ''}>${name}</option>`).join('');

      return modalShell({
        title: existing ? 'Edit task' : 'Create task',
        body: `
          <form id="taskForm" class="form">
            <label class="field">Task title
              <input name="title" maxlength="90" required autofocus value="${esc(task.title)}" placeholder="Enter a task title">
            </label>
            <label class="field">Description
              <textarea name="description" maxlength="500" placeholder="Add useful context">${esc(task.description)}</textarea>
            </label>
            <div class="form-row">
              <label class="field">Priority<select name="priority">${priorityOptions}</select></label>
              <label class="field">Due date<input name="dueDate" type="date" value="${esc(task.dueDate)}"></label>
            </div>
            <label class="field">Column<select name="columnId">${columnOptions}</select></label>
            <label class="field">Task color<select name="color">${colorOptions}</select></label>
            <div class="modal-foot">
              ${cancelButton}
              <button class="btn primary" type="submit">${existing ? 'Save changes' : 'Create task'}</button>
            </div>
          </form>`
      });
    }

    function renderColumnModal() {
      const existing = ui.modal.column;
      return modalShell({
        title: existing ? 'Rename column' : 'Add column',
        body: `
          <form id="columnForm" class="form">
            <label class="field">Column name
              <input name="columnName" maxlength="30" required autofocus value="${esc(existing?.title || '')}" placeholder="Enter a column name">
            </label>
            <div class="modal-foot">
              ${cancelButton}
              <button class="btn primary" type="submit">${existing ? 'Save changes' : 'Add column'}</button>
            </div>
          </form>`
      });
    }

    function renderConfirmModal() {
      const { title, message, confirmLabel } = ui.modal;
      return modalShell({
        title,
        role: 'alertdialog',
        describedBy: 'aria-describedby="dialogMessage"',
        body: `
          <div class="form">
            <p id="dialogMessage" class="dialog-copy">${esc(message)}</p>
            <div class="modal-foot">
              ${cancelButton}
              <button type="button" class="btn danger-btn" data-act="confirmModal">${esc(confirmLabel)}</button>
            </div>
          </div>`
      });
    }

    /* ---------- Task actions ---------- */
    // Remembers where a task was before it was completed, so un-completing can restore it.
    function setTaskColumn(task, column) {
      if (column.isDone && !isDone(task)) task.previousColumnId = task.columnId;
      if (!column.isDone) task.previousColumnId = null;
      task.columnId = column.id;
    }

    function moveTask(task, column, message = `Moved ${task.title} to ${column.title}`) {
      setTaskColumn(task, column);
      commit(message);
    }

    function toggleComplete(taskId) {
      const task = findTask(taskId);
      const doneColumn = getDoneColumn();
      if (!task || !doneColumn) return;

      if (!isDone(task)) {
        moveTask(task, doneColumn, `${task.title} marked complete`);
        return;
      }

      const previous = findColumn(task.previousColumnId);
      const target = previous && !previous.isDone ? previous : getFirstOpenColumn();
      if (target) moveTask(task, target, `${task.title} marked incomplete`);
    }

    function submitTaskForm(form) {
      const values = new FormData(form);
      const title = String(values.get('title')).trim();
      if (!title) {
        form.elements.title.focus();
        return;
      }

      const column = findColumn(String(values.get('columnId')));
      if (!column) {
        toast('Choose a valid column.');
        return;
      }

      const priority = String(values.get('priority'));
      const color = String(values.get('color'));
      const fields = {
        title,
        description: String(values.get('description')).trim(),
        priority: PRIORITIES.includes(priority) ? priority : 'Medium',
        dueDate: String(values.get('dueDate')),
        color: Object.values(TASK_COLORS).includes(color) ? color : DEFAULT_COLOR
      };

      const existing = ui.modal.task;
      ui.modal = null;

      if (existing) {
        Object.assign(existing, fields);
        if (existing.columnId !== column.id) setTaskColumn(existing, column);
        commit(`Updated ${title}`);
      } else {
        const task = { id: uid(), columnId: column.id, previousColumnId: null, ...fields };
        state.tasks.unshift(task);
        commit(`Created ${title}`);
      }
      toast('Task saved');
    }

    /* ---------- Column actions ---------- */
    function submitColumnForm(form) {
      const name = form.elements.columnName.value.trim().slice(0, 30);
      if (!name) {
        form.elements.columnName.focus();
        return;
      }

      const existing = ui.modal.column;
      ui.modal = null;

      if (existing) {
        existing.title = name;
        commit(`Renamed column to ${name}`);
      } else {
        state.columns.push({ id: uid(), title: name, accent: DEFAULT_COLUMN_ACCENT, isDone: false });
        commit(`Added column ${name}`);
      }
      toast('Column saved');
    }

    function confirmDeleteTask(taskId) {
      const task = findTask(taskId);
      if (!task) return;

      openModal({
        type: 'confirm',
        title: 'Delete task?',
        message: `Delete “${task.title}”? This action cannot be undone.`,
        confirmLabel: 'Delete task',
        onConfirm: () => {
          state.tasks = state.tasks.filter(item => item.id !== taskId);
          commit(`Deleted ${task.title}`);
        }
      }, '[data-act=confirmModal]');
    }

    function confirmDeleteColumn(columnId) {
      const column = findColumn(columnId);
      if (!column) return;

      if (state.columns.length < 2) {
        toast('At least one column is required.');
        return;
      }
      if (column.isDone && state.columns.filter(item => item.isDone).length === 1) {
        toast('You must keep at least one Done column.');
        return;
      }

      // Tasks move to a column of the same kind (done or open) when one exists.
      const others = state.columns.filter(item => item.id !== columnId);
      const target = others.find(item => item.isDone === column.isDone) || others[0];

      openModal({
        type: 'confirm',
        title: 'Delete column?',
        message: `Delete “${column.title}”? Its tasks will be moved to “${target.title}”. This action cannot be undone.`,
        confirmLabel: 'Delete column',
        onConfirm: () => {
          state.tasks.filter(task => task.columnId === columnId).forEach(task => setTaskColumn(task, target));
          state.columns = state.columns.filter(item => item.id !== columnId);
          commit(`Deleted column ${column.title}`);
        }
      }, '[data-act=confirmModal]');
    }

    /* ---------- Dialog actions ---------- */
    function openModal(modal, focusSelector) {
      ui.modal = modal;
      render();
      document.querySelector(focusSelector)?.focus();
    }

    function closeModal() {
      ui.modal = null;
      render();
    }

    function openTaskModal(taskId = null, columnId = null) {
      const task = taskId ? findTask(taskId) : null;
      const defaultColumn = findColumn(columnId) || findColumn(task?.columnId) || getFirstOpenColumn() || state.columns[0];
      openModal({ type: 'task', task, columnId: defaultColumn?.id }, '[name=title]');
    }

    function openColumnModal(column = null) {
      openModal({ type: 'column', column }, '[name=columnName]');
    }

    function confirmModal() {
      const { onConfirm } = ui.modal;
      ui.modal = null;
      onConfirm();
      toast('Changes saved');
    }

    /* ---------- Backup: export and import ---------- */
    function exportBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'taskforge-backup.json';
      link.click();
      URL.revokeObjectURL(url);
      toast('Backup exported');
    }

    async function importBackup(file) {
      try {
        const imported = validateData(JSON.parse(await file.text()));
        if (!window.confirm('Import this backup and replace the current Taskforge data? This cannot be undone.')) return;

        Object.assign(state, imported, {
          theme: imported.theme || state.theme,
          lastModified: Date.now()
        });
        Object.assign(ui, { view: 'board', search: '', filter: 'All', groupByPriority: false });
        save();
        render();
        toast('Backup imported successfully.');
      } catch (error) {
        console.error(error);
        toast(`Import failed: ${error.message || 'Invalid JSON file.'}`);
      }
    }

    /* ---------- Project title ---------- */
    function updateProjectTitle(rawValue, { finalize = false } = {}) {
      const title = (finalize ? rawValue.trim() : rawValue).slice(0, 60);
      state.projectTitle = title || 'Untitled project';
      state.lastModified = Date.now();
      save();

      document.querySelector('.breadcrumbs strong').textContent = state.projectTitle;
      document.querySelector('.head-meta').textContent = projectMeta();
      if (finalize) document.querySelector('#projectTitle').value = state.projectTitle;
    }

    /* ---------- Event handling ---------- */
    // Each button carries data-act="name"; this table says what that name does.
    const actions = {
      closeModal,
      backdrop: closeModal,
      confirmModal,
      newTask: ({ col }) => openTaskModal(null, col),
      editTask: ({ id }) => openTaskModal(id),
      toggleComplete: ({ id }) => toggleComplete(id),
      moveTask: ({ id, col }) => {
        const task = findTask(id);
        const column = findColumn(col);
        if (task && column) moveTask(task, column);
      },
      deleteTask: ({ id }) => confirmDeleteTask(id),
      addColumn: () => openColumnModal(),
      renameColumn: ({ id }) => openColumnModal(findColumn(id)),
      deleteColumn: ({ id }) => confirmDeleteColumn(id),
      toggleTheme: () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        save();
        render();
      },
      toggleGrouping: () => {
        ui.groupByPriority = !ui.groupByPriority;
        render();
      },
      showBoard: () => { ui.view = 'board'; render(); },
      showActivity: () => { ui.view = 'activity'; render(); },
      focusFilter: () => document.querySelector('#filter')?.focus(),
      exportBackup,
      importBackup: () => document.querySelector('#importFile')?.click()
    };

    function closeMenus(except = null) {
      document.querySelectorAll('details[open]').forEach(menu => {
        if (menu !== except) menu.open = false;
      });
    }

    document.addEventListener('click', event => {
      closeMenus(event.target.closest('details'));

      const tab = event.target.closest('[data-view]');
      if (tab) {
        ui.view = tab.dataset.view;
        render();
        return;
      }

      const button = event.target.closest('[data-act]');
      if (!button) return;
      // The backdrop only counts when the click lands on it, not on the dialog inside.
      if (button.dataset.act === 'backdrop' && event.target !== button) return;

      actions[button.dataset.act]?.(button.dataset);
    });

    document.addEventListener('input', event => {
      if (event.target.id === 'search') {
        ui.search = event.target.value;
        render();
      }
      if (event.target.id === 'projectTitle') {
        updateProjectTitle(event.target.value);
      }
    });

    document.addEventListener('change', event => {
      const target = event.target;

      if (target.id === 'filter') {
        ui.filter = target.value;
        render();
      }
      if (target.id === 'projectTitle') {
        updateProjectTitle(target.value, { finalize: true });
      }
      if (target.id === 'importFile') {
        const file = target.files?.[0];
        if (file) importBackup(file);
        target.value = '';
      }
      if (target.matches('[data-grid-move]') && target.value) {
        const task = findTask(target.dataset.gridMove);
        const column = findColumn(target.value);
        if (task && column) moveTask(task, column);
      }
    });

    document.addEventListener('submit', event => {
      event.preventDefault();
      if (event.target.id === 'taskForm') submitTaskForm(event.target);
      if (event.target.id === 'columnForm') submitColumnForm(event.target);
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (ui.modal) closeModal();
        closeMenus();
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        document.querySelector('#search')?.focus();
      }
    });

    // Place an opened menu next to its button, kept inside the window.
    document.addEventListener('toggle', event => {
      const details = event.target;
      if (!(details instanceof HTMLDetailsElement) || !details.open) return;

      const summary = details.querySelector('summary');
      const menu = details.querySelector('.menu');
      if (!summary || !menu) return;

      const anchor = summary.getBoundingClientRect();
      const left = Math.min(anchor.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 8);
      const top = Math.min(anchor.bottom + 4, window.innerHeight - menu.offsetHeight - 8);
      menu.style.left = `${Math.max(8, left)}px`;
      menu.style.top = `${Math.max(8, top)}px`;
    }, true);

    /* ---------- Drag and drop (desktop) ---------- */
    document.addEventListener('dragstart', event => {
      const card = event.target.closest('[data-task]');
      if (!card) return;
      ui.dragTaskId = card.dataset.task;
      event.dataTransfer.setData('text/plain', ui.dragTaskId);
      event.dataTransfer.effectAllowed = 'move';
    });

    document.addEventListener('dragover', event => {
      const zone = event.target.closest('[data-drop]');
      if (!zone) return;
      event.preventDefault();
      zone.classList.add('dragover');
    });

    document.addEventListener('dragleave', event => {
      const zone = event.target.closest('[data-drop]');
      if (zone && !zone.contains(event.relatedTarget)) zone.classList.remove('dragover');
    });

    document.addEventListener('dragend', () => {
      ui.dragTaskId = null;
      document.querySelectorAll('.dragover').forEach(zone => zone.classList.remove('dragover'));
    });

    document.addEventListener('drop', event => {
      const zone = event.target.closest('[data-drop]');
      if (!zone || !ui.dragTaskId) return;
      event.preventDefault();

      const task = findTask(ui.dragTaskId);
      const column = findColumn(zone.dataset.drop);
      ui.dragTaskId = null;

      if (task && column && task.columnId !== column.id) moveTask(task, column);
      else render();
    });

    /* ---------- Start ---------- */
    render();
  </script>
</body>
</html>
